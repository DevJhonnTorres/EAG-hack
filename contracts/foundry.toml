[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
# El dinero se mueve en enteros: cualquier truncamiento silencioso es un bug.
deny = "never"
fs_permissions = [{ access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

# Perfil liviano para el loop de desarrollo
[profile.lite]
optimizer = false
fuzz = { runs = 64 }
invariant = { runs = 16, depth = 16 }

# Perfil exhaustivo para CI / antes del pitch
[profile.ci.fuzz]
runs = 8192

[profile.ci.invariant]
runs = 1024
depth = 128

[rpc_endpoints]
hsk_testnet = "${HSK_TESTNET_RPC}"
hsk_mainnet = "${HSK_MAINNET_RPC}"
sepolia = "${SEPOLIA_RPC}"

[etherscan]
hsk_testnet = { key = "${BLOCKSCOUT_API_KEY}", url = "https://testnet-explorer.hskchain.net/api", chain = 133 }
hsk_mainnet = { key = "${BLOCKSCOUT_API_KEY}", url = "https://hsk.blockscout.com/api", chain = 177 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
